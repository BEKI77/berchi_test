# Builds the cashier's desktop window (desktop/) into a Windows installer.
#
# The salon's address is baked into the program at build time from the SALON_URL
# repository secret (Settings -> Secrets and variables -> Actions), so a cashier
# PC installs the program and connects with nothing to configure. A build without
# the secret falls back to http://localhost:3000; a tagged release without it
# fails rather than shipping that default to the salon.
#
# When it runs:
#   - a push or pull request that touches desktop/ -> builds, and keeps the
#     installer as a workflow artifact for 30 days.
#   - a tag like desktop-v0.1.0 -> builds and publishes a GitHub Release with the
#     installer attached, so the cashier PC can download it instead of needing
#     Rust installed. (GitHub skips paths filters for tag pushes, so a tag always
#     builds, whatever the tagged commit touched.)
#   - Actions tab -> Desktop app -> Run workflow -> builds on demand.
#
# The program is Windows-only -- WebView2, silent printing, an NSIS installer --
# so there is only a Windows job. The Rust unit tests do run here.
# desktop/scripts/verify-shell.mjs is deliberately left out: it drives a real web
# view against a running salon system, which CI has no way to provide. Run it on
# the development PC before tagging a release.

name: Desktop app

on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build per branch or tag; a new push replaces a running one.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    outputs:
      version: ${{ steps.app.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Keeps the compiled crates between runs. The first build takes about ten
      # minutes; later ones a few.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Tauri CLI
        run: npm ci

      - name: Read the version from tauri.conf.json
        id: app
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # The salon's address is compiled into the program, so it has to be settled
      # before the build rather than configured afterwards on every PC.
      #
      # It sits in a secret only to keep the domain out of this file. It is not a
      # credential: anyone holding the installer can read the address straight
      # back out of it, so nothing private belongs in it.
      - name: Check the salon address
        shell: bash
        env:
          SALON_URL: ${{ secrets.SALON_URL }}
        run: |
          if [ -z "$SALON_URL" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "The SALON_URL secret is not set, so this release would point every" >&2
              echo "cashier PC at http://localhost:3000. Add it under Settings ->" >&2
              echo "Secrets and variables -> Actions, then re-run this workflow." >&2
              exit 1
            fi
            echo "No SALON_URL secret (or a pull request from a fork): this build"
            echo "falls back to http://localhost:3000."
            exit 0
          fi
          case "$SALON_URL" in
            http://*|https://*) echo "Building against the SALON_URL secret." ;;
            *) echo "SALON_URL must start with http:// or https://" >&2; exit 1 ;;
          esac

      # A release named after a version the program does not report would be
      # confusing on the cashier PC, where the only version on show is the one in
      # Add/Remove Programs.
      - name: The tag and tauri.conf.json must agree
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#desktop-v}"
          built="${{ steps.app.outputs.version }}"
          if [ "$tagged" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, but desktop/src-tauri/tauri.conf.json says $built." >&2
            echo "Bump the version in tauri.conf.json and src-tauri/Cargo.toml, or retag." >&2
            exit 1
          fi

      # Choosing the address and the rules about where the window may go. The
      # tests needing the internet or a baked-in address are marked #[ignore],
      # so this needs nothing running.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        env:
          # Becomes the address the installed program polls, unless a
          # berchi-url.txt or BERCHI_URL on the PC says otherwise.
          BERCHI_DEFAULT_URL: ${{ secrets.SALON_URL }}
        run: npm run tauri build

      # Flattened, so the release job below has a path that does not depend on
      # where Cargo and the bundler happened to put things.
      - name: Collect what to keep
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          cp src-tauri/target/release/berchi-cashier.exe dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: berchi-cashier-${{ steps.app.outputs.version }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the installer
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: berchi-cashier-${{ needs.build.outputs.version }}
          path: dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          The cashier's desktop window. On the cashier PC:

          1. Download the `-setup.exe` below and run it. It installs for the
             signed-in Windows user only, so it needs no administrator rights.
             It is not code-signed, so SmartScreen may say "unknown publisher":
             choose **More info**, then **Run anyway**.
          2. The salon system must already be running on that PC
             (`docker compose -f docker-compose.cashier.yml ... up -d`).
          3. If the salon system is not on this PC's own port 3000, put its
             address (for example `http://192.168.1.50:3000`) on the first line
             of a file called `berchi-url.txt` next to the installed program.
          4. Start it. It shows *Starting the salon system* until the server
             answers, then opens the cashier screens by itself.

          Full setup: `desktop/README.md` and `docs/CASHIER_PC.md`.
          NOTES
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Berchi Cashier $VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*-setup.exe
