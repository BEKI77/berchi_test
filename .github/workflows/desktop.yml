#
# The program is Windows-only -- WebView2, silent printing, an NSIS installer --
# so there is only a Windows job. The Rust unit tests do run here.
# desktop/scripts/verify-shell.mjs is deliberately left out: it drives a real web
# view against a running salon system, which CI has no way to provide. Run it on
# the development PC before tagging a release.

name: Desktop app

on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build per branch or tag; a new push replaces a running one.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
