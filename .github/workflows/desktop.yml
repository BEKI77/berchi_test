      # The branch's pre-release is deleted and made again rather than edited:
      # that moves its tag to the commit just built, and drops the previous
      # build's installer, whose file name changes with the version. Being a
      # pre-release, it is never shown as the repository's latest release, so the
      # tagged versions keep that place.
      - name: Publish the branch's latest build
        if: steps.release.outputs.kind == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -euo pipefail
          commit="${GITHUB_SHA:0:7}"
          cat > notes.md <<NOTES
          The newest build of the \`$GITHUB_REF_NAME\` branch, from commit $commit. Every
          build of that branch replaces this pre-release, installer and all. For a
          version that stays put, use a \`desktop-v\` release.

          On the cashier PC, download the \`-setup.exe\` below and run it. It installs
          for the signed-in Windows user only, so it needs no administrator rights.
          It is not code-signed, so SmartScreen may say "unknown publisher": choose
          **More info**, then **Run anyway**.

          This build points at the address held in the \`SALON_URL\` secret. Full
          setup: \`desktop/README.md\` and \`docs/CASHIER_PC.md\`.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
