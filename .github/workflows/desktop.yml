    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Keeps the compiled crates between runs. The first build takes about ten
      # minutes; later ones a few.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Tauri CLI
        run: npm ci

      - name: Read the version from tauri.conf.json
        id: app
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Which release this build goes to, if any:
      #   kind=version -- a desktop-v* tag: that version's own release.
      #   kind=branch  -- a branch: its desktop-latest-<branch> pre-release, which
      #                   every build of the branch replaces. Anything in the
      #                   branch name but letters, digits, ".", "_" and "-"
      #                   becomes "-", so feature/x gives desktop-latest-feature-x.
      #   neither      -- a pull request, or a manual run on some other tag.
      - name: Work out where the installer is published
        id: release
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            pull_request/*) ;;
            */tag)
              case "$GITHUB_REF_NAME" in
                desktop-v*)
                  echo "kind=version" >> "$GITHUB_OUTPUT"
                  echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
              esac ;;
            */branch)
              echo "kind=branch" >> "$GITHUB_OUTPUT"
              echo "tag=desktop-latest-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}" >> "$GITHUB_OUTPUT" ;;
          esac

      # The salon's address is compiled into the program, so it has to be settled
      # before the build rather than configured afterwards on every PC.
      #
      # It sits in a secret only to keep the domain out of this file. It is not a
      # credential: anyone holding the installer can read the address straight
      # back out of it, so nothing private belongs in it.
      - name: Check the salon address
        shell: bash
        env:
          SALON_URL: ${{ secrets.SALON_URL }}
          RELEASE: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$SALON_URL" ]; then
            if [ -n "$RELEASE" ]; then
              echo "The SALON_URL secret is not set, so release $RELEASE would point every" >&2
              echo "cashier PC at http://localhost:3000. Add it under Settings ->" >&2
              echo "Secrets and variables -> Actions, then re-run this workflow." >&2
              exit 1
            fi
            echo "No SALON_URL secret (or a pull request from a fork): this build"
            echo "falls back to http://localhost:3000."
            exit 0
          fi
          case "$SALON_URL" in
            http://*|https://*) echo "Building against the SALON_URL secret." ;;
            *) echo "SALON_URL must start with http:// or https://" >&2; exit 1 ;;
          esac

      # A release named after a version the program does not report would be
      # confusing on the cashier PC, where the only version on show is the one in
      # Add/Remove Programs.
      - name: The tag and tauri.conf.json must agree
        if: steps.release.outputs.kind == 'version'
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#desktop-v}"
          built="${{ steps.app.outputs.version }}"
          if [ "$tagged" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, but desktop/src-tauri/tauri.conf.json says $built." >&2
            echo "Bump the version in tauri.conf.json and src-tauri/Cargo.toml, or retag." >&2
            exit 1
          fi

      # Choosing the address and the rules about where the window may go. The
      # tests needing the internet or a baked-in address are marked #[ignore],
      # so this needs nothing running.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        env:
          # Becomes the address the installed program polls, unless a
          # berchi-url.txt or BERCHI_URL on the PC says otherwise.
          BERCHI_DEFAULT_URL: ${{ secrets.SALON_URL }}
        run: npm run tauri build

      # Flattened, so the steps below have a path that does not depend on where
